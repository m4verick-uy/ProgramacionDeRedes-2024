version: '3.9'

services:
  grpc-server:
    build:
      context: ./GrpcServer
    image: grpc-server-image
    container_name: grpc-server-container
    networks:
      - red-local-2025
    tty: true
    stdin_open: true
    ports:
      - "5001:5001"     # Puerto gRPC
      - "10000:10000"   # Puerto TCP del servidor embebido

networks:
  red-local-2025:
    driver: bridge

